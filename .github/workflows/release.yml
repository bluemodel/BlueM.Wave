name: Publish release

on:
  push:
    tags:
    - "*"

jobs:
  build-and-release:
    runs-on: windows-2025-vs2026

    steps:
      - name: Parse version from latest tag
        id: version
        uses: release-kit/semver@v2
        
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Create TeeChart license file from secret
        uses: lukasa1993/secret-file-action@v1.0.4
        id: teechart-license
        with:
          secret: ${{ secrets.TEECHARTLICENSE }}
          b64-decode: false
          
      - name: Copy TeeChart license file
        run: copy ${{ steps.teechart-license.outputs.file }} "source\My Project\TeeChart.licenses"
        
      - name: Build Wave
        run: dotnet build source\Wave.vbproj --arch x64 --configuration Release
        
      - name: Create zip archive
        run: Compress-Archive -Path source\bin\Release\net10.0-windows\win-x64\* -DestinationPath BlueM.Wave_${{ steps.version.outputs.full }}_x64.zip
        
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: setup\Wave.Setup.iss
          options: |
            /DMyAppVersion=${{ steps.version.outputs.full }}
            /DMySourceDir=..\source\bin\Release\net10.0-windows\win-x64

      - name: Release
        uses: softprops/action-gh-release@v3.0.1
        with:
          name: "v${{ steps.version.outputs.full }}"
          draft: true # for now
          body: "[Full changelog](https://github.com/bluemodel/BlueM.Wave/blob/${{ steps.version.outputs.full }}/source/CHANGELOG.md)"
          files: |
            BlueM.Wave_${{ steps.version.outputs.full }}_x64.zip
            setup\BlueM.Wave_${{ steps.version.outputs.full }}_x64_setup.exe