name: Publish release

on:
  push:
    tags:
    - "*"

jobs:
  build-and-release:
  
    runs-on: windows-2025-vs2026

    permissions:
      id-token: write # required to be able to create an ID token to authenticate the workflow run with OSSign
      actions: write # required to be able to dispatch workflows

    steps:
      - name: Parse version from latest tag
        id: version
        uses: release-kit/semver@97491c46500b6e758ced599794164a234b8aa08c # v2
        
      # Build a release just for test purposes
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Create TeeChart license file from secret
        uses: lukasa1993/secret-file-action@eb2230640a85a7dd02728cbad59d593fa98df11a # v1.0.4
        id: teechart-license
        with:
          secret: ${{ secrets.TEECHARTLICENSE }}
          b64-decode: false
          
      - name: Copy TeeChart license file
        run: copy ${{ steps.teechart-license.outputs.file }} "source\My Project\TeeChart.licenses"
        
      - name: Build Wave
        run: dotnet build source\Wave.vbproj --arch x64 --configuration Release
        
      - name: Create zip archive
        run: Compress-Archive -Path source\bin\Release\net10.0-windows\win-x64\* -DestinationPath BlueM.Wave_${{ steps.version.outputs.full }}_x64.zip
        
      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@36e43b836ce2c78d21787b1f7183caf85c60ba05 # v1.3.0
        with:
          path: setup\Wave.Setup.iss
          options: |
            /DMyAppVersion=${{ steps.version.outputs.full }}
            /DMySourceDir=..\source\bin\Release\net10.0-windows\win-x64

      # Skip the release of unsigned files
      #- name: Release
      #  uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      #  with:
      #    name: "v${{ steps.version.outputs.full }}"
      #    draft: true # for now
      #    body: "[Full changelog](https://github.com/bluemodel/BlueM.Wave/blob/${{ steps.version.outputs.full }}/source/CHANGELOG.md)"
      #    files: |
      #      BlueM.Wave_${{ steps.version.outputs.full }}_x64.zip
      #      setup\BlueM.Wave_${{ steps.version.outputs.full }}_x64_setup.exe

      # Instead. dispatch a request to the OSSign repo for build + signing
      - name: Dispatch to OSSign
        id: dispatch
        uses: OSSign/actions/workflow/trusted-dispatch@5dd7e6b3fa626cb429ec2956354855f40581bb1d # v4
        with:
          dispatch_only: true
        
      # Echo the workflow ID for debugging purposes
      - run: |
          echo "Received workflow ID: ${{ steps.dispatch.outputs.workflow_id }}"
    
      # Starts the waiting loop, only required with dispatch_only: true
      # This will start the release-wait-publish.yml workflow. For more information, see that file.    
      - name: Start the waiting loop
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: release-wait-publish.yml
          inputs: |
            { 
              "workflow_id": "${{ steps.dispatch.outputs.workflow_id }}",
              "version": "${{ steps.version.outputs.full }}"
            }